[project]
name = "mai-desktop-message-adapter"
version = "0.1.1"
description = "Mai 桌面伙伴的独立 MaiBot 消息协议适配器"
requires-python = ">=3.11"
dependencies = ["maim-message==0.6.8", "websockets==15.0.1", "certifi>=2025.1.31,<2027"]

[project.scripts]
mai-desktop-adapter = "desktop_adapter.__main__:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["desktop_adapter"]
